[package]
name = "tiler-macos"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "tiler-macos"

[[bin]]
name = "tiler-macos"
path = "src/main.rs"

[[bin]]
name = "tiler-macos-probe-target"
path = "src/bin/probe_target.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiler-core = { path = "../tiler-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent"] }
core-foundation = "0.10"
core-graphics = "0.25"
