[package]
name = "tiler-macos"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "tiler-macos"
autotests = false

[[bin]]
name = "tiler-macos"
path = "src/main.rs"

[[bin]]
name = "tiler-macos-probe-target"
path = "src/bin/probe_target.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiler-core = { path = "../tiler-core" }

# Test-only pin of the actual Windows portable policy: comparing real
# `tiler_windows::tiling` predicates against `tiler-core::window_policy`
# without a core dependency cycle and without rewiring either adapter.
[dev-dependencies]
tiler-windows = { path = "../tiler-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGError", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGSession", "libc"] }
core-foundation = "0.10"
core-graphics = "0.25"

[lints.rust]
unsafe_code = "deny"
