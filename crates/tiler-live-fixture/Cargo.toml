[package]
name = "tiler-live-fixture"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Development-only controllable live test windows (winit + softbuffer), driven over a private local JSON-lines protocol."
default-run = "tiler-live-fixture"

[[bin]]
name = "tiler-live-fixture"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Dynamic-loading backend features: compile without X11/Wayland headers.
# Runtime display libraries are still required for live use (see devenv.nix).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# MIT-licensed bundled 8x8 bitmap glyphs (no outline-font stack, no font files).
font8x8 = { version = "0.3", default-features = false }

# Safe UID check for socket-dir ownership (Unix only; no unsafe).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = true, features = ["process"] }

# Minimal standard Window menu (macOS serve only): the sole unsafe owner is
# the reviewed `menu_macos` module, mirroring `pipe_win.rs` on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# Windows named-pipe transport: popular maintained tokio pipe API plus a
# minimal reviewed unsafe module (src/pipe_win.rs) for the owner-only
# security descriptor. windows-sys 0.61 matches the workspace pin.
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
tiler-windows = { path = "../tiler-windows" }
# Dedicated DXGI probe example only (win-dxgi-probe): same locked windows
# 0.61 line as tiler-windows, no new packages. Never attached to fixture HWNDs.
windows = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
