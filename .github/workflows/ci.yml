name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Install KWin dependencies
        run: devenv shell --impure -- npm ci --prefix kwin
      - name: Build Rust Planner fixture for KWin tests
        run: devenv shell --impure -- cargo build --locked -p tiler-protocol --example planner_eval
      - name: KWin tests
        run: devenv shell --impure -- npm test --prefix kwin
      - name: KWin typecheck
        run: devenv shell --impure -- npm run typecheck --prefix kwin

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Rust workspace tests
        run: devenv shell --impure -- cargo test --workspace
      - name: Unsafe allowlist gate
        run: devenv shell --impure -- cargo test --locked -p tiler-core --test unsafe_guardrail
      - name: Rust format
        run: devenv shell --impure -- cargo fmt --all -- --check
      - name: Rust strict Clippy
        run: devenv shell --impure -- cargo clippy --workspace --all-targets -- -D warnings
      - name: KDE settings exporter freshness
        run: devenv shell --impure -- cargo run --locked -p tiler-kde-settings-exporter -- --check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Install KWin dependencies for shell fixtures
        run: devenv shell --impure -- npm ci --prefix kwin
      - name: Build KWin fixture bundle
        run: devenv shell --impure -- npm run build --prefix kwin
      - name: Build tray fixture binary
        run: devenv shell --impure -- just build-rust
      - name: Headless shell suites
        run: |
          devenv shell --impure -- bash -euo pipefail -c '
            log="$(mktemp)"
            for suite in scripts/*.test.sh; do
              if ! TRAY_05B_BINARY="$PWD/target/debug/omnitiler" bash "$suite" 2>&1 | tee "$log"; then
                echo "::error::${suite} failed"
                while IFS= read -r line; do
                  echo "::error::${line//%/%25}"
                done < <(tail -n 40 "$log")
                rm -f -- "$log"
                exit 1
              fi
            done
            rm -f -- "$log"
          '

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Native effect tests
        run: nix build -j1 --cores 4 .#checks.x86_64-linux.native-effect-tests --print-build-logs
      - name: Native settings tests
        run: nix build -j1 --cores 4 .#checks.x86_64-linux.native-settings-tests --print-build-logs

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: License gate
        run: devenv shell --impure -- cargo deny --locked check licenses
      - name: Dependency bans gate
        run: devenv shell --impure -- cargo deny --locked check bans
      - name: Sources gate
        run: devenv shell --impure -- cargo deny --locked check sources

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Fetch locked crate sources
        run: devenv shell --impure -- cargo fetch --locked
      - name: Third-party notices freshness
        run: devenv shell --impure -- just check-third-party-notices

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Refresh stable Rust
        run: |
          $ErrorActionPreference = 'Stop'
          mise exec -- rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify mise-selected tools
        run: |
          $ErrorActionPreference = 'Stop'
          $rustcOut = mise exec -- rustc -vV
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $rustcOut
          if (($rustcOut | Out-String) -notmatch 'x86_64-pc-windows-msvc') { Write-Error "unexpected rustc host: $rustcOut"; exit 1 }
          foreach ($tool in @('cargo', 'just', 'jq', 'gh', 'rg', 'yq')) {
            mise exec -- $tool --version
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Build portable crates
        run: mise exec -- cargo build --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows -p tiler-macos
      - name: Test portable crates
        run: mise exec -- cargo test --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows -p tiler-macos
      - name: Unsafe allowlist gate
        run: mise exec -- cargo test --locked -p tiler-core --test unsafe_guardrail
      - name: Rust format
        run: mise exec -- cargo fmt --all -- --check
      - name: Rust strict Clippy
        run: mise exec -- cargo clippy --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows -p tiler-macos --all-targets -- -D warnings
      - name: Check for whitespace errors
        run: git diff --check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Refresh stable Rust
        run: mise exec -- rustup update stable --no-self-update
      - name: Verify mise-selected tools
        run: |
          rustc_out="$(mise exec -- rustc -vV)"
          echo "$rustc_out"
          echo "$rustc_out" | grep 'aarch64-apple-darwin'
          for tool in cargo just jq gh rg; do
            mise exec -- "$tool" --version
          done
          mise exec -- cargo fmt --version
          mise exec -- cargo clippy --version
      - name: Build macOS probe plus portable crates
        run: mise exec -- cargo build --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-macos
      - name: Test macOS probe plus portable crates
        run: mise exec -- cargo test --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-macos
      - name: Unsafe allowlist gate
        run: mise exec -- cargo test --locked -p tiler-core --test unsafe_guardrail
      - name: Rust format
        run: mise exec -- cargo fmt --all -- --check
      - name: Rust strict Clippy
        run: mise exec -- cargo clippy --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-macos --all-targets -- -D warnings
      - name: Check for whitespace errors
        run: git diff --check
